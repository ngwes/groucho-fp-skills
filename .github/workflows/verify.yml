name: Verify skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # skill-be's GitHub Action runs the skill-be that npm ci installed.
      - uses: ngwes/skill-be@v1
      - uses: ngwes/skill-be@v1
        with:
          args: --config skill-be.code-tests.yaml
