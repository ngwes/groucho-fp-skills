name: Code tests

# Started by hand from the Actions tab, on the branch of an open pull request. It calls the model
# with the ANTHROPIC_API_KEY secret, so it never runs on its own. The judged benchmark is not run
# here: verify.yml checks it from the committed skill-be.result.json.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  HUSKY: 0

concurrency:
  group: code-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Require an open pull request for the branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            echo "::error::$BRANCH has no open pull request; run this workflow on a PR branch."
            exit 1
          fi
          echo "Pull request #$pr"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global @anthropic-ai/claude-code
      - uses: ngwes/skill-be@v1
        with:
          command: run
          args: --config skill-be.code-tests.yaml --html
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Keeps the page of the run, also when a skill is NOT READY.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          path: .skill-be/results/*/results.html
          archive: false
